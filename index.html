<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amigos do Brilho</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Rubik',sans-serif;
    background:#000;
    overflow-x:hidden;
}

.hero{
    width:100%;
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* FUNDO */

.hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

.overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.95) 0%,
        rgba(0,0,0,.78) 32%,
        rgba(0,0,0,.25) 68%,
        rgba(0,0,0,.60) 100%
    );
    z-index:2;
}

.container{
    width:100%;
    max-width:1320px;
    margin:auto;
    position:relative;
    z-index:5;
    padding:28px 70px;
}

/* HEADER */

.header{
    width:100%;
    height:96px;
    border:1.5px solid #ff8c00;
    border-radius:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 36px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(10px);
}

.logo{
    width:155px;
    height:auto;
}

.menu{
    display:flex;
    align-items:center;
    gap:38px;
}

.menu a{
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:300;
    transition:.3s;
}

.menu a:hover{
    color:#ff8c00;
}

.menu .active{
    font-weight:800;
}

.contact-btn{
    background:#16ba2f;
    color:#fff;
    text-decoration:none;
    padding:18px 48px;
    border-radius:50px;
    font-size:18px;
    font-weight:800;
}

/* HERO */

.hero-content{
    width:100%;
    min-height:calc(100vh - 130px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.hero-text{
    width:42%;
}

.hero-text h1{
    color:#f2f2f2;
    font-size:78px;
    line-height:.92;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-2px;
}

.hero-text h1 span{
    color:#ff8c00;
}

.hero-text p{
    margin-top:26px;
    color:#fff;
    font-size:27px;
    line-height:1.05;
    font-weight:300;
    max-width:520px;
}

/* BOTÕES */

.hero-buttons{
    margin-top:42px;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:460px;
}

.hero-buttons a{
    width:100%;
    height:74px;
    border-radius:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
    transition:.3s;
}

.btn-products{
    background:#ff8c00;
    color:#000;
}

.btn-products:hover{
    transform:translateY(-2px);
}

.btn-whatsapp{
    background:#18c133;
    color:#fff;
}

.btn-whatsapp:hover{
    transform:translateY(-2px);
}

/* SLIDER */

.hero-slider{
    width:58%;
    height:720px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transform:translateX(120px) scale(.95);
    transition:1s ease;
}

.slide.active{
    opacity:1;
    pointer-events:auto;
    transform:translateX(0) scale(1);
}

.product-wrap{
    width:100%;
    height:100%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* PRODUTOS */

.product{
    position:relative;
    z-index:5;
    width:auto;
    object-fit:contain;
    filter:drop-shadow(0 25px 45px rgba(0,0,0,.55));
    animation:float 3.2s ease-in-out infinite;
}

/* TAMANHOS INDIVIDUAIS */

.product.coat{
    max-height:580px;
}

.product.luster{
    max-height:650px;
}

.product.graphene{
    max-height:660px;
}

/* GLOW */

.glow{
    position:absolute;
    width:180px;
    opacity:.95;
    z-index:2;
    animation:spin 10s linear infinite;
}

.glow-one{
    top:130px;
    left:120px;
}

.glow-two{
    bottom:130px;
    right:120px;
}

/* CONTROLES */

.slider-controls{
    position:absolute;
    top:130px;
    right:50px;
    z-index:30;
    display:flex;
    gap:12px;
}

.slider-controls button{
    width:64px;
    height:64px;
    border-radius:18px;
    border:2px solid #ff8c00;
    background:rgba(0,0,0,.42);
    color:#ff8c00;
    font-size:42px;
    cursor:pointer;
    transition:.3s;
}

.slider-controls button:hover{
    background:#ff8c00;
    color:#000;
}

/* DOTS */

.dots{
    position:absolute;
    bottom:36px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:20;
}

.dot{
    width:15px;
    height:15px;
    border-radius:50%;
    border:2px solid #fff;
    background:transparent;
    cursor:pointer;
}

.dot.active{
    background:#ff8c00;
    border-color:#ff8c00;
}

/* ANIMAÇÕES */

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-14px);
    }
    100%{
        transform:translateY(0px);
    }
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* RESPONSIVO */

@media(max-width:1100px){

    .container{
        padding:20px;
    }

    .menu{
        display:none;
    }

    .header{
        height:84px;
        padding:0 20px;
    }

    .logo{
        width:120px;
    }

    .contact-btn{
        padding:14px 28px;
        font-size:15px;
    }

    .hero-content{
        flex-direction:column;
        align-items:flex-start;
        padding-top:40px;
    }

    .hero-text,
    .hero-slider{
        width:100%;
    }

    .hero-text h1{
        font-size:52px;
    }

    .hero-text p{
        font-size:22px;
    }

    .hero-buttons{
        max-width:100%;
    }

    .hero-buttons a{
        height:62px;
        font-size:21px;
    }

    .hero-slider{
        height:560px;
        margin-top:20px;
    }

    .product.coat{
        max-height:400px;
    }

    .product.luster{
        max-height:470px;
    }

    .product.graphene{
        max-height:480px;
    }

    .glow{
        width:120px;
    }

    .glow-one{
        top:80px;
        left:60px;
    }

    .glow-two{
        bottom:80px;
        right:60px;
    }

    .slider-controls{
        top:20px;
        right:10px;
    }

}

</style>
</head>

<body>

<section class="hero">

    <!-- FUNDO -->
    <img 
        class="hero-bg" 
        src="assets/hero-bg.webp" 
        alt="Fundo Amigos do Brilho"
    >

    <div class="overlay"></div>

    <div class="container">

        <!-- HEADER -->

        <header class="header">

            <img 
                class="logo" 
                src="assets/logo-amigos-do-brilho.png" 
                alt="Logo Amigos do Brilho"
            >

            <nav class="menu">
                <a href="#" class="active">INÍCIO</a>
                <a href="#">PRODUTOS</a>
                <a href="#">LINHA PREMIUM</a>
                <a href="#">SOBRE</a>
            </nav>

            <a href="#" class="contact-btn">
                CONTATO
            </a>

        </header>

        <!-- HERO -->

        <div class="hero-content">

            <!-- TEXTO -->

            <div class="hero-text">

                <h1>
                    ESTÉTICA<br>
                    AUTOMOTIVA EM<br>
                    <span>OUTRO NÍVEL!</span>
                </h1>

                <p>
                    Produtos premium para brilho,
                    acabamento e proteção automotiva.
                </p>

                <div class="hero-buttons">

                    <a href="#" class="btn-products">
                        VER PRODUTOS
                    </a>

                    <a href="#" class="btn-whatsapp">
                        FALAR NO WHATSAPP
                    </a>

                </div>

            </div>

            <!-- SLIDER -->

            <div class="hero-slider" id="slider">

                <!-- CONTROLES -->

                <div class="slider-controls">

                    <button id="prev">
                        ‹
                    </button>

                    <button id="next">
                        ›
                    </button>

                </div>

                <!-- SLIDE 1 -->

                <div class="slide active">

                    <div class="product-wrap">

                        <img 
                            src="assets/produto-coat-ceramic.png" 
                            class="glow glow-one"
                        >

                        <img 
                            src="assets/produto-coat-ceramic.png" 
                            class="glow glow-two"
                        >

                        <img 
                            src="assets/produto-coat-ceramic.png"
                            class="product coat"
                            alt="Produto Coat Ceramic"
                        >

                    </div>

                </div>

                <!-- SLIDE 2 -->

                <div class="slide">

                    <div class="product-wrap">

                        <img 
                            src="assets/glow.webp" 
                            class="glow glow-one"
                        >

                        <img 
                            src="assets/glow.webp" 
                            class="glow glow-two"
                        >

                        <img 
                            src="assets/produto-luster.webp"
                            class="product luster"
                            alt="Produto Luster"
                        >

                    </div>

                </div>

                <!-- SLIDE 3 -->

                <div class="slide">

                    <div class="product-wrap">

                        <img 
                            src="assets/glow.webp" 
                            class="glow glow-one"
                        >

                        <img 
                            src="assets/glow.webp" 
                            class="glow glow-two"
                        >

                        <img 
                            src="assets/produto-graphene.webp"
                            class="product graphene"
                            alt="Produto Graphene"
                        >

                    </div>

                </div>

                <!-- DOTS -->

                <div class="dots">

                    <button class="dot active"></button>
                    <button class="dot"></button>
                    <button class="dot"></button>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');

let current = 0;

function showSlide(index){

    slides.forEach(slide=>{
        slide.classList.remove('active');
    });

    dots.forEach(dot=>{
        dot.classList.remove('active');
    });

    slides[index].classList.add('active');
    dots[index].classList.add('active');

}

function nextSlide(){

    current++;

    if(current >= slides.length){
        current = 0;
    }

    showSlide(current);

}

function prevSlide(){

    current--;

    if(current < 0){
        current = slides.length - 1;
    }

    showSlide(current);

}

document.getElementById('next').addEventListener('click',nextSlide);

document.getElementById('prev').addEventListener('click',prevSlide);

dots.forEach((dot,index)=>{

    dot.addEventListener('click',()=>{

        current = index;

        showSlide(current);

    });

});

/* AUTO SLIDE */

setInterval(()=>{

    nextSlide();

},6000);

/* DRAG SLIDE */

const slider = document.getElementById('slider');

let startX = 0;

slider.addEventListener('touchstart',(e)=>{

    startX = e.touches[0].clientX;

});

slider.addEventListener('touchend',(e)=>{

    let endX = e.changedTouches[0].clientX;

    let diff = startX - endX;

    if(diff > 50){
        nextSlide();
    }

    if(diff < -50){
        prevSlide();
    }

});

</script>

</body>
</html>
