<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amigos do Brilho</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Rubik',sans-serif;
    background:#000;
    overflow-x:hidden;
}

.hero{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

.hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.94) 0%,
        rgba(0,0,0,.78) 34%,
        rgba(0,0,0,.22) 68%,
        rgba(0,0,0,.60) 100%
    );
    z-index:2;
}

.container{
    position:relative;
    z-index:5;
    max-width:1280px;
    margin:0 auto;
    padding:30px 70px;
}

.header{
    height:100px;
    border:1.5px solid #ff8a00;
    border-radius:70px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 36px;
}

.logo{
    width:150px;
    height:auto;
}

.menu{
    display:flex;
    align-items:center;
    gap:32px;
}

.menu a{
    color:#fff;
    text-decoration:none;
    font-size:19px;
    font-weight:300;
}

.menu a.active{
    font-weight:800;
}

.contact-btn{
    background:#14b82a;
    color:#fff;
    text-decoration:none;
    padding:18px 60px;
    border-radius:50px;
    font-size:20px;
    font-weight:800;
}

.hero-content{
    min-height:calc(100vh - 130px);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.hero-text{
    width:43%;
    padding-top:20px;
}

.hero-text h1{
    color:#e8e8e8;
    font-size:62px;
    line-height:.93;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-2px;
}

.hero-text h1 span{
    color:#ff8a00;
}

.hero-text p{
    margin-top:20px;
    color:#fff;
    font-size:27px;
    line-height:1.02;
    font-weight:300;
    max-width:520px;
}

.hero-buttons{
    margin-top:42px;
    display:flex;
    flex-direction:column;
    gap:12px;
    max-width:438px;
}

.hero-buttons a{
    text-decoration:none;
    height:72px;
    border-radius:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:900;
}

.btn-products{
    background:#ff8a00;
    color:#000;
}

.btn-whatsapp{
    background:#13b928;
    color:#fff;
}

.hero-slider{
    width:57%;
    height:640px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transform:translateX(100px) scale(.96);
    transition:opacity .7s ease, transform .7s ease;
}

.slide.active{
    opacity:1;
    pointer-events:auto;
    transform:translateX(0) scale(1);
}

.product-wrap{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product{
    position:relative;
    z-index:4;
    max-height:520px;
    width:auto;
    object-fit:contain;
    filter:drop-shadow(0 25px 45px rgba(0,0,0,.65));
    animation:floatProduct 3.2s ease-in-out infinite;
}

.product.coat{
    max-height:500px;
}

.product.luster{
    max-height:590px;
}

.product.graphene{
    max-height:610px;
}

.glow{
    position:absolute;
    z-index:2;
    width:175px;
    height:auto;
    opacity:.95;
    animation:spinGlow 9s linear infinite;
}

.glow-one{
    top:125px;
    left:135px;
}

.glow-two{
    bottom:125px;
    right:135px;
}

.slider-controls{
    position:absolute;
    top:145px;
    right:50px;
    z-index:20;
    display:flex;
    gap:10px;
}

.slider-controls button{
    width:56px;
    height:56px;
    border:2px solid #ff8a00;
    border-radius:16px;
    background:rgba(0,0,0,.45);
    color:#ff8a00;
    font-size:42px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.25s;
}

.slider-controls button:hover{
    background:#ff8a00;
    color:#000;
}

.dots{
    position:absolute;
    bottom:42px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    gap:12px;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid #fff;
    background:transparent;
    cursor:pointer;
}

.dot.active{
    background:#ff8a00;
    border-color:#ff8a00;
}

@keyframes floatProduct{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-14px); }
    100%{ transform:translateY(0); }
}

@keyframes spinGlow{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

@media(max-width:1024px){
    .container{
        padding:22px;
    }

    .header{
        height:82px;
        padding:0 22px;
    }

    .menu{
        display:none;
    }

    .logo{
        width:125px;
    }

    .contact-btn{
        padding:14px 30px;
        font-size:16px;
    }

    .hero-content{
        flex-direction:column;
        align-items:flex-start;
        padding-top:42px;
    }

    .hero-text,
    .hero-slider{
        width:100%;
    }

    .hero-text h1{
        font-size:46px;
    }

    .hero-text p{
        font-size:22px;
    }

    .hero-buttons{
        max-width:100%;
    }

    .hero-buttons a{
        height:62px;
        font-size:21px;
    }

    .hero-slider{
        height:520px;
        margin-top:20px;
    }

    .product.coat{
        max-height:390px;
    }

    .product.luster{
        max-height:450px;
    }

    .product.graphene{
        max-height:470px;
    }

    .glow{
        width:125px;
    }

    .glow-one{
        top:80px;
        left:80px;
    }

    .glow-two{
        bottom:90px;
        right:80px;
    }

    .slider-controls{
        top:20px;
        right:10px;
    }
}
</style>
</head>

<body>

<section class="hero">

    <!-- FUNDO SEM PRODUTO -->
    <img class="hero-bg" src="assets/img/PARTE 1 AMIGOS DO BRILHO(1).webp" alt="Fundo Amigos do Brilho">

    <div class="overlay"></div>

    <div class="container">

        <header class="header">

            <img class="logo" src="assets/img/logo.webp" alt="Amigos do Brilho">

            <nav class="menu">
                <a href="#" class="active">INÍCIO</a>
                <a href="#">PRODUTOS</a>
                <a href="#">LINHA PREMIUM</a>
                <a href="#">SOBRE NÓS</a>
            </nav>

            <a href="#" class="contact-btn">CONTATO</a>

        </header>

        <div class="hero-content">

            <div class="hero-text">

                <h1>
                    ESTÉTICA<br>
                    AUTOMOTIVA EM<br>
                    <span>OUTRO NÍVEL!</span>
                </h1>

                <p>
                    Produtos profissionais para brilho,
                    proteção e acabamento premium
                    no seu carro.
                </p>

                <div class="hero-buttons">
                    <a href="#" class="btn-products">VER PRODUTOS</a>
                    <a href="#" class="btn-whatsapp">FALAR NO WHATSAPP</a>
                </div>

            </div>

            <div class="hero-slider" id="slider">

                <div class="slider-controls">
                    <button type="button" id="next">›</button>
                    <button type="button" id="prev">‹</button>
                </div>

                <!-- SLIDE 1 -->
                <div class="slide active">
                    <div class="product-wrap">
                        <img src="assets/img/glow.webp" class="glow glow-one" alt="">
                        <img src="assets/img/glow.webp" class="glow glow-two" alt="">
                        <img src="assets/img/PRODUT O1.png" class="product coat" alt="Coat Ceramic">
                    </div>
                </div>

                <!-- SLIDE 2 -->
                <div class="slide">
                    <div class="product-wrap">
                        <img src="assets/img/glow.webp" class="glow glow-one" alt="">
                        <img src="assets/img/glow.webp" class="glow glow-two" alt="">
                        <img src="assets/img/PRODUTO 2.webp" class="product luster" alt="Luster Vonixx">
                    </div>
                </div>

                <!-- SLIDE 3 -->
                <div class="slide">
                    <div class="product-wrap">
                        <img src="assets/img/glow.webp" class="glow glow-one" alt="">
                        <img src="assets/img/glow.webp" class="glow glow-two" alt="">
                        <img src="assets/img/PRODUTO 3.webp" class="product graphene" alt="Graphene Evox">
                    </div>
                </div>

                <div class="dots">
                    <button class="dot active" type="button"></button>
                    <button class="dot" type="button"></button>
                    <button class="dot" type="button"></button>
                </div>

            </div>

        </div>

    </div>

</section>

<script>
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
const slider = document.getElementById('slider');

let currentSlide = 0;
let startX = 0;
let isDragging = false;

function showSlide(index){
    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));

    slides[index].classList.add('active');
    dots[index].classList.add('active');
}

function nextSlide(){
    currentSlide = currentSlide + 1;

    if(currentSlide >= slides.length){
        currentSlide = 0;
    }

    showSlide(currentSlide);
}

function prevSlide(){
    currentSlide = currentSlide - 1;

    if(currentSlide < 0){
        currentSlide = slides.length - 1;
    }

    showSlide(currentSlide);
}

document.getElementById('next').addEventListener('click', nextSlide);
document.getElementById('prev').addEventListener('click', prevSlide);

dots.forEach((dot, index) => {
    dot.addEventListener('click', () => {
        currentSlide = index;
        showSlide(currentSlide);
    });
});

slider.addEventListener('mousedown', e => {
    isDragging = true;
    startX = e.clientX;
});

slider.addEventListener('mouseup', e => {
    if(!isDragging) return;

    let endX = e.clientX;
    let diff = startX - endX;

    if(diff > 50){
        nextSlide();
    }

    if(diff < -50){
        prevSlide();
    }

    isDragging = false;
});

slider.addEventListener('mouseleave', () => {
    isDragging = false;
});

slider.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
});

slider.addEventListener('touchend', e => {
    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if(diff > 50){
        nextSlide();
    }

    if(diff < -50){
        prevSlide();
    }
});

setInterval(nextSlide, 6000);
</script>

</body>
</html>
