<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Amigos do Brilho</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Rubik',sans-serif;
    background:#000;
    overflow-x:hidden;
}

.hero{
    width:100%;
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

.hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.92) 0%,
        rgba(0,0,0,.70) 35%,
        rgba(0,0,0,.20) 70%,
        rgba(0,0,0,.55) 100%
    );
    z-index:2;
}

.container{
    width:100%;
    max-width:1280px;
    margin:auto;
    position:relative;
    z-index:10;
    padding:30px 70px;
}

.header{
    width:100%;
    border:1.5px solid #ff8c00;
    border-radius:70px;
    padding:22px 35px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    backdrop-filter:blur(12px);
    background:rgba(0,0,0,.45);
}

.logo{
    width:160px;
}

.menu{
    display:flex;
    gap:40px;
    align-items:center;
}

.menu a{
    text-decoration:none;
    color:#fff;
    font-size:20px;
    font-weight:300;
    transition:.3s;
}

.menu a:hover{
    color:#ff8c00;
}

.menu .active{
    font-weight:700;
}

.contact-btn{
    background:#1ec71e;
    color:#fff;
    text-decoration:none;
    padding:18px 55px;
    border-radius:50px;
    font-weight:700;
    font-size:20px;
}

.hero-content{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:60px;
    gap:30px;
}

.left{
    width:45%;
}

.left h1{
    color:#fff;
    font-size:84px;
    line-height:.92;
    font-weight:800;
    text-transform:uppercase;
}

.left h1 span{
    color:#ff8c00;
}

.left p{
    color:#fff;
    font-size:28px;
    line-height:1.1;
    margin-top:30px;
    font-weight:300;
    max-width:550px;
}

.buttons{
    margin-top:45px;
    display:flex;
    flex-direction:column;
    gap:20px;
    width:100%;
    max-width:470px;
}

.btn-orange{
    background:#ff9500;
    color:#000;
    text-align:center;
    padding:24px;
    border-radius:70px;
    text-decoration:none;
    font-size:26px;
    font-weight:800;
}

.btn-green{
    background:#18c318;
    color:#fff;
    text-align:center;
    padding:24px;
    border-radius:70px;
    text-decoration:none;
    font-size:26px;
    font-weight:800;
}

.right{
    width:55%;
    position:relative;
    height:720px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.slider{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transform:translateX(120px);
    transition:1s ease;
    display:flex;
    align-items:center;
    justify-content:center;
}

.slide.active{
    opacity:1;
    transform:translateX(0);
}

.product{
    position:relative;
    z-index:5;
    max-height:620px;
    width:auto;
    object-fit:contain;
    animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));
}

.glow{
    position:absolute;
    width:180px;
    z-index:2;
    opacity:.95;
    animation:spin 8s linear infinite;
}

.glow1{
    top:170px;
    left:140px;
}

.glow2{
    bottom:150px;
    right:130px;
}

.controls{
    position:absolute;
    top:110px;
    right:70px;
    display:flex;
    gap:14px;
    z-index:20;
}

.control-btn{
    width:72px;
    height:72px;
    border-radius:18px;
    border:2px solid #ff8c00;
    background:rgba(0,0,0,.4);
    color:#ff8c00;
    font-size:40px;
    cursor:pointer;
    transition:.3s;
}

.control-btn:hover{
    background:#ff8c00;
    color:#000;
}

.dots{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:20;
}

.dot{
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid #fff;
    cursor:pointer;
}

.dot.active{
    background:#ff8c00;
    border-color:#ff8c00;
}

@keyframes float{
    0%{ transform:translateY(0px);}
    50%{ transform:translateY(-12px);}
    100%{ transform:translateY(0px);}
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:1100px){

    .hero-content{
        flex-direction:column;
    }

    .left,
    .right{
        width:100%;
    }

    .left h1{
        font-size:58px;
    }

    .left p{
        font-size:22px;
    }

    .menu{
        display:none;
    }

    .container{
        padding:20px;
    }

    .right{
        height:540px;
    }

    .product{
        max-height:430px;
    }

    .controls{
        top:30px;
        right:20px;
    }

}

</style>
</head>

<body>

<section class="hero">

    <img src="assets/img/bg.webp" class="hero-bg">
    <div class="overlay"></div>

    <div class="container">

        <header class="header">

            <img src="assets/img/logo.webp" class="logo">

            <nav class="menu">
                <a href="#" class="active">INÍCIO</a>
                <a href="#">PRODUTOS</a>
                <a href="#">LINHA PREMIUM</a>
                <a href="#">SOBRE NÓS</a>
            </nav>

            <a href="#" class="contact-btn">CONTATO</a>

        </header>

        <div class="hero-content">

            <div class="left">

                <h1>
                    ESTÉTICA<br>
                    AUTOMOTIVA EM<br>
                    <span>OUTRO NÍVEL!</span>
                </h1>

                <p>
                    Produtos profissionais para brilho,
                    proteção e acabamento premium
                    no seu carro.
                </p>

                <div class="buttons">

                    <a href="#" class="btn-orange">
                        VER PRODUTOS
                    </a>

                    <a href="#" class="btn-green">
                        FALAR NO WHATSAPP
                    </a>

                </div>

            </div>

            <div class="right">

                <div class="controls">

                    <button class="control-btn" id="prev">
                        ‹
                    </button>

                    <button class="control-btn" id="next">
                        ›
                    </button>

                </div>

                <div class="slider">

                    <div class="slide active">

                        <img src="assets/img/glow.webp" class="glow glow1">
                        <img src="assets/img/glow.webp" class="glow glow2">

                        <img src="assets/img/produto1.webp" class="product">

                    </div>

                    <div class="slide">

                        <img src="assets/img/glow.webp" class="glow glow1">
                        <img src="assets/img/glow.webp" class="glow glow2">

                        <img src="assets/img/produto2.webp" class="product">

                    </div>

                    <div class="slide">

                        <img src="assets/img/glow.webp" class="glow glow1">
                        <img src="assets/img/glow.webp" class="glow glow2">

                        <img src="assets/img/produto3.webp" class="product">

                    </div>

                </div>

                <div class="dots">

                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');

let current = 0;

function showSlide(index){

    slides.forEach(slide=>{
        slide.classList.remove('active');
    });

    dots.forEach(dot=>{
        dot.classList.remove('active');
    });

    slides[index].classList.add('active');
    dots[index].classList.add('active');

}

document.getElementById('next').addEventListener('click',()=>{

    current++;

    if(current >= slides.length){
        current = 0;
    }

    showSlide(current);

});

document.getElementById('prev').addEventListener('click',()=>{

    current--;

    if(current < 0){
        current = slides.length - 1;
    }

    showSlide(current);

});

dots.forEach((dot,index)=>{

    dot.addEventListener('click',()=>{

        current = index;

        showSlide(current);

    });

});

setInterval(()=>{

    current++;

    if(current >= slides.length){
        current = 0;
    }

    showSlide(current);

},5000);

</script>

</body>
</html>
