<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amigos do Brilho | Hero Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="site-wrapper">
    <section class="hero" id="inicio" aria-label="Primeira sessão Amigos do Brilho">
      <div class="hero__bg"></div>
      <div class="hero__shade"></div>

      <header class="nav">
        <a class="nav__logo" href="#inicio" aria-label="Amigos do Brilho">
          <img src="assets/img/logo-amigos-do-brilho.png" alt="Amigos do Brilho Produtos Automotivos">
        </a>

        <button class="nav__toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <nav class="nav__menu" aria-label="Menu principal">
          <a class="active" href="#inicio">Início</a>
          <a href="#produtos">Produtos</a>
          <a href="#premium">Linha Premium</a>
          <a href="#sobre">Sobre nós</a>
        </nav>

        <a class="nav__contact" href="https://wa.me/5544999999999" target="_blank" rel="noopener">Contato</a>
      </header>

      <div class="hero__content">
        <div class="hero__copy">
          <h1>
            Estética<br>
            automotiva em<br>
            <span>outro nível!</span>
          </h1>
          <p>Produtos profissionais para brilho, proteção e acabamento premium no seu carro.</p>

          <div class="hero__actions">
            <a class="btn btn--orange" href="#produtos">Ver produtos</a>
            <a class="btn btn--green" href="https://wa.me/5544999999999" target="_blank" rel="noopener">Falar no WhatsApp</a>
          </div>
        </div>

        <div class="hero__slider" id="produtos">
          <div class="slider" data-slider>
            <div class="slider__track">
              <article class="slide is-active" data-title="Coat Ceramic">
                <img src="assets/img/produto-coat-ceramic.png" alt="Coat Ceramic Protelim" draggable="false">
              </article>
              <article class="slide" data-title="Luster">
                <img src="assets/img/produto-luster.webp" alt="Luster Vonixx" draggable="false">
              </article>
              <article class="slide" data-title="Graphene Cleaner and Protect">
                <img src="assets/img/produto-graphene.webp" alt="Graphene Cleaner and Protect Evox" draggable="false">
              </article>
            </div>

            <div class="slider__controls" aria-label="Controles do slider">
              <button class="slider__btn" type="button" data-next aria-label="Próximo produto">›</button>
              <button class="slider__btn" type="button" data-prev aria-label="Produto anterior">‹</button>
            </div>

            <div class="slider__dots" aria-label="Indicadores do slider"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
