<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amigos do Brilho | Produtos automotivos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Rubik',sans-serif;
    background:#000;
    overflow-x:hidden;
}

/* HERO */

.hero{
    width:100%;
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* FUNDO */

.hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

.overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.96) 0%,
        rgba(0,0,0,.84) 34%,
        rgba(0,0,0,.18) 68%,
        rgba(0,0,0,.58) 100%
    );
    z-index:2;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:1320px;
    margin:auto;
    position:relative;
    z-index:5;
    padding:28px 70px;
}

/* HEADER */

.header{
    width:100%;
    height:96px;
    border:1.5px solid #ff8c00;
    border-radius:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 36px;
    background:rgba(0,0,0,.58);
    backdrop-filter:blur(10px);
}

.logo{
    width:155px;
}

.menu{
    display:flex;
    align-items:center;
    gap:38px;
}

.menu a{
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:300;
    transition:.3s;
}

.menu a:hover{
    color:#ff8c00;
}

.menu .active{
    font-weight:800;
}

.contact-btn{
    background:#18c133;
    color:#fff;
    text-decoration:none;
    padding:18px 48px;
    border-radius:50px;
    font-size:18px;
    font-weight:800;
}

/* HERO CONTENT */

.hero-content{
    width:100%;
    min-height:calc(100vh - 130px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

/* TEXTO */

.hero-text{
    width:42%;
}

.hero-text h1{
    color:#f2f2f2;
    font-size:78px;
    line-height:.92;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-2px;
}

.hero-text h1 span{
    color:#ff8c00;
}

.hero-text p{
    margin-top:26px;
    color:#fff;
    font-size:27px;
    line-height:1.05;
    font-weight:300;
    max-width:520px;
}

/* BOTÕES */

.hero-buttons{
    margin-top:42px;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:460px;
}

.hero-buttons a{
    width:100%;
    height:74px;
    border-radius:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
    transition:.3s;
}

.btn-products{
    background:#ff8c00;
    color:#000;
}

.btn-whatsapp{
    background:#18c133;
    color:#fff;
}

.hero-buttons a:hover{
    transform:translateY(-2px);
}

/* SLIDER */

.hero-slider{
    width:58%;
    height:720px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* SLIDES */

.slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transform:translateX(120px) scale(.95);
    transition:1s ease;
}

.slide.active{
    opacity:1;
    pointer-events:auto;
    transform:translateX(0) scale(1);
}

.product-wrap{
    width:100%;
    height:100%;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:72px;
}

/* PRODUTOS */

.product{
    position:relative;
    z-index:5;
    width:auto;
    object-fit:contain;
    filter:drop-shadow(0 25px 45px rgba(0,0,0,.55));
    animation:none;
    pointer-events:none;
}

/* PRODUTOS NO PÓDIO */

.product.coat{
    max-height:590px;
    margin-top:0;
}

.product.luster{
    max-height:665px;
    margin-top:0;
}

.product.graphene{
    max-height:675px;
    margin-top:0;
}

/* GLOW */

.product-light{
    position:absolute;
    z-index:2;
    width:330px;
    height:330px;
    border-radius:50%;
    background:
    radial-gradient(
        circle,
        rgba(255,140,0,.40),
        rgba(255,140,0,.08) 42%,
        rgba(255,140,0,0) 70%
    );

    filter:blur(8px);

    animation:pulse 3s ease-in-out infinite;
}

.light-one{
    top:120px;
    left:90px;
}

.light-two{
    right:80px;
